# ─── Префикс Ctrl+q ──────────────────────────────────
unbind C-b
set -g prefix C-q
bind q send-prefix

# ─── Навигация по панелям: Ctrl+q, затем h/j/k/l ──────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Изменение размеров панелей: Ctrl+q, затем H/J/K/L
# Флаг -r позволяет повторять клавишу без повторного префикса
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ─── Vim-клавиши в режиме копирования ────────────────
setw -g mode-keys vi

# Вход: Ctrl+q, затем [
# Навигация: h/j/k/l, Ctrl+u / Ctrl+d, поиск / и ?
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel

# Options to make tmux more pleasant
set -g mouse on
set -g default-terminal "tmux-256color"

# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

# Load catppuccin
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux
# For TPM, instead use `run ~/.tmux/plugins/tmux/catppuccin.tmux`

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"

# Or, if using TPM, just run TPM

bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

set-option -g status-position top

# Vim-подобные клавиши в режиме копирования.
setw -g mode-keys vi

# Мышь: выбор панелей и прокрутка истории.
set -g mouse on

# v — начать выделение.
bind-key -T copy-mode-vi v send-keys -X begin-selection

# y — скопировать выделение в буфер Sway и выйти.
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy'

# Выделение мышью тоже отправлять в буфер Sway.
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'wl-copy'
